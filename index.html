<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A L'Oréal beauty product recommendation assistant."
    />
    <title>L'Oréal Beauty Assistant</title>
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="page-wrapper">
      <!------- Header / Branding ------->
      <header class="site-header">
        <a
          class="brand"
          href="index.html"
          aria-label="L'Oréal Beauty Assistant home"
        >
          <img
            src="img/loreal-logo.png"
            alt="L'Oréal Paris"
            class="brand-logo"
          />
          <span class="brand-divider" aria-hidden="true"></span>
          <span class="brand-label">Beauty assistant</span>
        </a>
        <div class="header-copy">
          <p class="eyebrow">Personalized beauty guidance</p>
          <h1 class="site-title">Discover what works for you.</h1>
          <p class="site-subtitle">
            Ask about L'Oréal makeup, skincare, haircare, fragrances, and
            routines.
          </p>
        </div>
      </header>

      <!------- Chat Area ------->
      <main>
        <section class="chatbox" aria-labelledby="chat-heading">
          <div class="chat-heading">
            <div>
              <p class="eyebrow">L'Oréal Paris</p>
              <h2 id="chat-heading">Your beauty consultation</h2>
            </div>
            <span class="status-indicator"
              ><span aria-hidden="true"></span>Online</span
            >
          </div>
          <div id="chatWindow" class="chat-window">
            <!-- messages will be appended here via JS -->
          </div>

          <form id="chatForm" class="chat-form">
            <label for="userInput" class="visually-hidden">Message</label>
            <input
              id="userInput"
              name="userInput"
              type="text"
              placeholder="Ask about a product or routine"
              autocomplete="off"
              required
            />
            <button type="submit" id="sendBtn" aria-label="Send message">
              <span class="material-icons">send</span>
              <span class="visually-hidden">Send</span>
            </button>
          </form>
        </section>
      </main>

      <!------- Footer Links ------->
      <footer class="site-footer">
        <p>&copy; 2025 L'Oréal Paris. Beauty for all.</p>
        <nav>
          <!-- These URLs are placeholders -->
          <a href="#">Privacy Policy</a>
          <a href="#">Terms of Use</a>
          <a href="#">Contact</a>
        </nav>
      </footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
